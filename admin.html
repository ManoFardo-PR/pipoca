<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pipoca · Plataforma</title>
  <link rel="stylesheet" href="./src/tokens.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="./support.js"></script>
  <script src="./src/core/roteador.js"></script>
  <!-- fase06: config PÚBLICA do backend (window.PIPOCA_CONFIG) antes dos bundles. -->
  <script src="./pipoca.config.js"></script>
  <!-- Fase 04: núcleos administrativos canônicos (src/admin) via bundle próprio.
       Gerado por `npm run build:admin`. O app da criança NÃO carrega este bundle
       (e este entry não carrega nada do app da criança). -->
  <script src="./pipoca.admin.bundle.js"></script>
  <!-- Cérebro do admin: window.PipocaAdmin (sessão + navegação com guard fail-closed). -->
  <script src="./src/admin/estadoAdmin.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    /* A11y transversal (B3 · UI-A34): as MESMAS classes do app; o AdminShell as aplica a
       partir de prefers-reduced-motion / prefers-contrast do sistema (decisão do dono: sem
       toggles próprios nesta onda). O foco visível e --pip-mov vêm de src/tokens.css. */
    .pip-dyslexia, .pip-dyslexia * { font-family: 'Atkinson Hyperlegible', sans-serif !important; letter-spacing: 0.04em; }
    .pip-contrast [style*="color: rgb(44, 36, 26)"] { color: #120e08 !important; }
    .pip-contrast [style*="color: rgb(107, 98, 85)"], .pip-contrast [style*="color: rgb(122, 106, 84)"],
    .pip-contrast [style*="color: rgb(138, 122, 100)"], .pip-contrast [style*="color: rgb(154, 138, 114)"] { color: #2c241a !important; }
    .pip-reduce-motion *, .pip-reduce-motion *::before, .pip-reduce-motion *::after { animation-iteration-count: 1 !important; }
  </style>
</head>
<body>
<x-dc>
<!-- Entry fino da PLATAFORMA (operador da casa Pipoca — nunca a criança).
     As telas SA_* vivem em src/admin/telas|componentes e sobem por
     componente-irmão via <dc-import name="AdminShell">. -->
<dc-import name="AdminShell"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pipoca</title>
  <link rel="stylesheet" href="./src/tokens.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Nunito:wght@400;500;600;700;800;900&family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="./support.js"></script>
  <script src="./src/core/roteador.js"></script>
  <!-- Convergência (TRILHA M-A): módulos canônicos de src/ (motor, validador, CORE,
       repo, telemetria, agregados) via bundle. Gerado por `npm run build:app`. -->
  <script src="./pipoca.bundle.js"></script>
  <style>
    @keyframes pipFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    @keyframes pipBloom{0%{transform:scale(.5);opacity:0}55%{transform:scale(1.12);opacity:1}100%{transform:scale(1);opacity:1}}
    @keyframes avBloom{0%{transform:scale(.5);opacity:0}55%{transform:scale(1.08);opacity:1}100%{transform:scale(1);opacity:1}}
    @keyframes pipPop{0%{transform:scale(.2);opacity:0}60%{transform:scale(1.2);opacity:1}100%{transform:scale(1);opacity:1}}
    @keyframes pipGlow{0%,100%{opacity:.5}50%{opacity:1}}
    .av-enter { animation: avBloom .42s ease forwards; }
    .earn-bloom { animation: pipBloom .55s cubic-bezier(.22,1,.36,1) forwards; }
    .earn-pop { animation: pipPop .4s ease forwards; }
    .word-stuck { animation: pipGlow 1.8s ease-in-out infinite; }
    .pip-barra-fill { transition: width .25s ease; }
    .chip-drag { cursor:grab; }
    .chip-drag:active { cursor:grabbing; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    /* ── A11y transversal classes applied to root ─────────────────────────── */
    .pip-dyslexia, .pip-dyslexia * { font-family: 'Atkinson Hyperlegible', sans-serif !important; letter-spacing: 0.04em; }
    .pip-contrast  { --pip-tinta: #1a1008 !important; }
    .pip-contrast  * { color: #1a1008 !important; }
    .pip-contrast  [style*="color:#9a8a72"] { color: #5a4a38 !important; }
    .pip-reduce-motion *, .pip-reduce-motion *::before, .pip-reduce-motion *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
  </style>
</head>
<body>
<x-dc>
  <!-- App canônico: o Shell monta a tela ativa (T1–T7) no seu slot, conduzido
       pelo window.PipocaRoteador. As telas leem o estado via window.PipocaApp
       (exposto por este host). Lei do contrato: telas falam só com o seam. -->
  <Shell dev="{{ dev }}"/>

  <!-- Overlay de acessibilidade "Do meu jeito" — montado por cima quando aberto. -->
  <sc-if value="{{ showA11y }}" hint-placeholder-val="{{ false }}">
    <PainelA11y/>
  </sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script>
/**
 * Host canônico (raiz servível). Dono do EstadoApp e da "loja" window.PipocaApp.
 * Não renderiza telas: delega ao <Shell/>, que monta T1–T7 por componente-irmão.
 *
 * window.PipocaApp (seam das telas):
 *   estado (getter)  — EstadoApp vivo (perfil, historia, economia, modos, a11y, gate*)
 *   setState(patch)  — único mutador; se patch.tela muda, conduz o PipocaRoteador
 *   motor / ordem    — instâncias canônicas (criarMotor após validarGrafo)
 *   cenario          — grafo validado
 *   repo             — RepositorioPersistencia (criarRepositorio; lei do seam)
 */
class Component extends DCLogic {
  state = (() => {
    const C = window.PipocaCanonico;
    const base = (C && C.estado && C.estado.estadoInicial) ? C.estado.estadoInicial : {};
    // KIDMODE aterrissa na entrada da criança (T2). UI-state das telas começa limpo.
    return {
      ...base,
      tela: 2,
      modoApp: 'crianca',
      showA11y: false,
      storyMsg: null,
      gateObjId: null,
      gateTrecho: '',
      gatePalavraIdx: 0,
      gateStage: 'reading',
      gateEarned: 0,
    };
  })();

  // Superfícies adultas (KIDMODE): só acessíveis no modo cuidador. T1 (PINGATE) é a
  // ponte e NÃO entra aqui — a criança pode pedir o portão.
  _superficiesAdultas() { return [8, 10, 11, 12, 13, 14, 15]; }

  // Espelho síncrono do modo (evita corrida com o setState assíncrono na guarda).
  _modoApp = 'crianca';

  _guardTela(n) {
    const M = window.PipocaCanonico && window.PipocaCanonico.modoApp;
    if (!M) return n;
    return M.aplicarGuarda(this._modoApp || 'crianca', n, this._superficiesAdultas());
  }

  _navegar(n) {
    this.setState({ tela: n });
    if (window.PipocaRoteador) window.PipocaRoteador.irParaTela(n);
  }

  // PINGATE: cria o PIN no 1º uso; depois verifica com lockout suave (acesso.ts).
  _verificarPinCuidador(pin) {
    const A = window.PipocaCanonico && window.PipocaCanonico.acesso;
    if (!A) return { ok: false, bloqueado: false, dica: 'Indisponível.' };
    let st = A.carregarAcesso();
    if (st.pinHash === null) {
      A.salvarAcesso(A.definirPin(st, pin));
      this._entrarCuidador();
      return { ok: true, bloqueado: false };
    }
    const r = A.verificarPin(st, pin, Date.now());
    A.salvarAcesso(r.estado);
    if (r.ok) { this._entrarCuidador(); return { ok: true, bloqueado: false }; }
    return { ok: false, bloqueado: !!r.bloqueado, dica: r.dica };
  }

  _entrarCuidador() {
    const M = window.PipocaCanonico && window.PipocaCanonico.modoApp;
    const modoApp = M ? M.aoPassarPortao() : 'cuidador';
    this._modoApp = modoApp;
    this.setState({ modoApp, tela: 10 }); // PC_HOME (onboarding/hub do cuidador)
    if (window.PipocaRoteador) window.PipocaRoteador.irParaTela(10);
  }

  _irParaCrianca() {
    const M = window.PipocaCanonico && window.PipocaCanonico.modoApp;
    const modoApp = M ? M.aoVoltarParaCrianca() : 'crianca';
    this._modoApp = modoApp;
    this.setState({ modoApp, tela: 2 });
    if (window.PipocaRoteador) window.PipocaRoteador.irParaTela(2);
  }

  async componentDidMount() {
    const self = this;
    const Canon = window.PipocaCanonico;

    // Repositório (seam) — origem de perfis/save/telemetria das telas.
    try { this._repo = Canon ? Canon.criarRepositorio() : null; }
    catch (e) { console.warn('[PipocaApp] criarRepositorio falhou:', e); this._repo = null; }

    // Expõe a "loja" que as telas .dc.html consomem.
    window.PipocaApp = {
      get estado() { return self.state; },
      setState(patch) {
        let p = patch;
        // KIDMODE: guarda de superfícies adultas na navegação.
        if (p && typeof p.tela === 'number') {
          const permitida = self._guardTela(p.tela);
          if (permitida !== p.tela) p = { ...p, tela: permitida };
        }
        self.setState(p);
        // Telas navegam por setState({tela}); conduzir o roteador faz o Shell remontar.
        if (p && typeof p.tela === 'number' && window.PipocaRoteador) {
          window.PipocaRoteador.irParaTela(p.tela);
        }
      },
      get motor() { return self._motor; },
      get ordem() { return self._ordem; },
      get cenario() { return self._cenario; },
      get repo() { return self._repo; },
      // PINGATE / KIDMODE (seam das telas parentais)
      verificarPinCuidador(pin) { return self._verificarPinCuidador(pin); },
      aoVoltarParaCrianca() { self._irParaCrianca(); },
      abrirPortao() { self._navegar(1); },
    };

    // Mantém estado.tela em sincronia com o roteador (fonte única de navegação).
    const R = window.PipocaRoteador;
    if (R) this._unsubR = R.onTelaChange((n) => self.setState({ tela: n }));

    // Motor/validador CANÔNICOS: carrega o grafo, valida e instancia { motor, ordem }
    // pela fábrica. A troca A↔B só acontece aqui (lei do contrato).
    let grafoRaw = null;
    try {
      const resp = await fetch('./src/dados/quintal_grafo.json');
      grafoRaw = await resp.json();
    } catch (e) { console.warn('[PipocaApp] grafo:', e); }
    try {
      const g = (Canon && grafoRaw) ? Canon.validarGrafo(grafoRaw) : null;
      if (g) {
        this._grafo = g;
        this._cenario = g.cenario;
        const modos = (this.state && this.state.modos) || (Canon.modos && Canon.modos.modosPadrao);
        const par = Canon.criarMotor(g.cenario, modos);
        this._motor = par.motor;
        this._ordem = par.ordem;
      }
    } catch (e) { console.warn('[PipocaApp] motor:', e); }
    if (!this._cenario) {
      // Fallback mínimo (offline / bundle ausente) — degrada sem narrativa rica.
      this._cenario = { id: 'quintal_anoitecer', nome: 'O Quintal', personagem: 'a Joana', ordem_canonica: ['vagalume', 'frasco', 'vento'], objetos: [] };
    }

    // Aterrissa na tela inicial (T2). _tela do roteador começa em 1 → notifica o Shell.
    if (R) R.irParaTela(this.state.tela || 2);
    this.setState({});
  }

  componentWillUnmount() {
    if (this._unsubR) this._unsubR();
  }

  renderVals() {
    return {
      dev: true, // M-A: jumper de telas visível para verificação; gating em marco posterior
      showA11y: !!this.state.showA11y,
    };
  }
}
</script>
</body>
</html>

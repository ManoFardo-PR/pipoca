<!-- AdminShell.dc.html — Shell da plataforma do operador (fase04)
     ─────────────────────────────────────────────────────────────
     Espelho enxuto do Shell do app: assina window.PipocaRoteador +
     window.PipocaAdmin e monta a tela SA_* ativa por componente-irmão.
     Numeração interna: 1 login · 2 hub · 3 tenants · 4 conteúdo · 5 IA ·
     6 segurança · 7 IA global (chaves/modelos/fallback — tarefa #31).
     O guard vive em estadoAdmin.js (setState); aqui só se renderiza.
-->
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
  </style>
</helmet>

<div ref="{{ refRoot }}" style="position:fixed;inset:0;overflow:hidden;font-family:var(--pip-fonte-texto,'Nunito');color:#2c241a;background:linear-gradient(180deg,#f4f1ea 0%, #eae4d7 100%);">

  <!-- Marca sóbria da plataforma -->
  <div style="position:absolute;top:0;left:0;right:0;height:52px;display:flex;align-items:center;gap:10px;padding:0 20px;background:rgba(44,36,26,.92);z-index:30;">
    <div style="width:22px;height:22px;border-radius:7px;background:linear-gradient(150deg,#e8965a,#d5713f);display:flex;align-items:center;justify-content:center;">
      <div style="width:8px;height:8px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff3cf,#f4b65a);"></div>
    </div>
    <div style="font-family:var(--pip-fonte-titulo,'Baloo 2');font-weight:800;font-size:15px;color:#f4f1ea;">Pipoca · Plataforma</div>
    <div style="margin-left:auto;font-family:'Nunito';font-size:12px;color:rgba(244,241,234,.7);">área do operador — não é a tela da criança</div>
  </div>

  <!-- B11 (UI-A15): navegação mínima — as áreas como TABS no topo (decisão do dono).
       De qualquer área, 1 toque para qualquer outra; a atual leva aria-current=page.
       Só aparece com sessão válida (no login não há para onde ir). -->
  <sc-if value="{{ mostrarTabs }}" hint-placeholder-val="{{ false }}">
  <div role="tablist" aria-label="Áreas da plataforma" style="position:absolute;top:52px;left:0;right:0;height:46px;display:flex;align-items:center;gap:6px;padding:0 12px;background:#efe9db;border-bottom:1px solid #d8cfbd;z-index:29;overflow-x:auto;">
    <sc-for list="{{ tabs }}" as="tb" hint-placeholder-count="6">
      <button onClick="{{ tb.abrir }}" aria-current="{{ tb.atual }}" aria-disabled="{{ tb.inerte }}" style="{{ tb.style }}">{{ tb.nome }}</button>
    </sc-for>
  </div>
  </sc-if>

  <!-- Slot das telas SA_* — B10 (UI-A13): as filhas usam inset:0, que resolve contra o
       padding box (padding-top não empurrava nada e a barra cobria eyebrow/Sair);
       top reserva a barra (e as tabs, quando visíveis) de verdade. -->
  <div style="{{ slotStyle }}">
    <sc-if value="{{ ehSA1 }}" hint-placeholder-val="{{ true }}"><dc-import name="SaLogin"></dc-import></sc-if>
    <sc-if value="{{ ehSA2 }}" hint-placeholder-val="{{ false }}"><dc-import name="SaHome"></dc-import></sc-if>
    <sc-if value="{{ ehSA3 }}" hint-placeholder-val="{{ false }}"><dc-import name="SaTenant"></dc-import></sc-if>
    <sc-if value="{{ ehSA4 }}" hint-placeholder-val="{{ false }}"><dc-import name="Conteudo"></dc-import></sc-if>
    <sc-if value="{{ ehSA5 }}" hint-placeholder-val="{{ false }}"><dc-import name="ConfigIA"></dc-import></sc-if>
    <sc-if value="{{ ehSA6 }}" hint-placeholder-val="{{ false }}"><dc-import name="Seguranca"></dc-import></sc-if>
    <sc-if value="{{ ehSA7 }}" hint-placeholder-val="{{ false }}"><dc-import name="IaGlobal"></dc-import></sc-if>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  // estadoAdmin.js posiciona o roteador antes da hidratação; ler o valor atual
  // evita flash (mesmo gesto do Shell do app).
  state = { tela: (window.PipocaRoteador && window.PipocaRoteador.telaAtual && window.PipocaRoteador.telaAtual()) || 1 };

  // B3 (Plan03 · UI-A34): o operador recebe as preferências de a11y do SISTEMA —
  // prefers-reduced-motion / prefers-contrast viram as mesmas classes do app na raiz
  // (tokens.css zera --pip-mov e escurece a tinta). Sem toggles próprios nesta onda.
  // O ref só liga se for devolvido pelo renderVals (lição do B1).
  refRoot = (el) => { this._rootEl = el; this._aplicarA11y(); };

  _aplicarA11y() {
    const el = this._rootEl; if (!el || typeof window.matchMedia !== 'function') return;
    const mq = (q) => { try { return window.matchMedia(q).matches; } catch (_) { return false; } };
    el.classList.toggle('pip-reduce-motion', mq('(prefers-reduced-motion: reduce)'));
    el.classList.toggle('pip-contrast', mq('(prefers-contrast: more)'));
  }

  componentDidMount() {
    const R = window.PipocaRoteador;
    if (R) {
      this.setState({ tela: R.telaAtual() });
      this._unsubR = R.onTelaChange((n) => this.setState({ tela: n }));
    }
    const A = window.PipocaAdmin;
    if (A && A.subscribe) this._unsubA = A.subscribe(() => this.setState({}));
    // Reage se o operador mudar a preferência do sistema com a página aberta.
    if (typeof window.matchMedia === 'function') {
      this._mqs = ['(prefers-reduced-motion: reduce)', '(prefers-contrast: more)'].map((q) => {
        const m = window.matchMedia(q); const fn = () => this._aplicarA11y();
        try { m.addEventListener('change', fn); } catch (_) { try { m.addListener(fn); } catch (_2) {} }
        return { m, fn };
      });
    }
    this._aplicarA11y();
  }

  componentWillUnmount() {
    if (this._unsubR) this._unsubR();
    if (this._unsubA) this._unsubA();
    (this._mqs || []).forEach(({ m, fn }) => { try { m.removeEventListener('change', fn); } catch (_) { try { m.removeListener(fn); } catch (_2) {} } });
  }

  renderVals() {
    const t = this.state.tela;
    const A = window.PipocaAdmin;
    const C = window.PipocaAdminCanonico;
    const sess = A ? A.estado.sessao : null;
    const escopo = sess ? sess.escopoTenants : null;
    const mostrarTabs = t >= 2;
    // B11: mesmas áreas do hub (rotasAdmin), com o fail-closed de escopo do CartaoArea.
    const defs = [
      { nome: 'Painel', tela: 2, area: null },
      { nome: 'Contas e planos', tela: 3, area: 'tenants' },
      { nome: 'Conteúdo', tela: 4, area: 'conteudo' },
      { nome: 'IA por conta', tela: 5, area: 'ia' },
      { nome: 'Segurança', tela: 6, area: 'seguranca' },
      { nome: 'IA global', tela: 7, area: 'iaGlobal' },
    ];
    const tabBase = 'min-height:44px;border-radius:999px;border:1px solid;font-family:Nunito;font-weight:700;font-size:12.5px;cursor:pointer;padding:6px 14px;white-space:nowrap;';
    const tabs = defs.map((d) => {
      const disponivel = d.area === null || !!(sess && C && C.auth.areaDisponivel(escopo, d.area));
      const atual = t === d.tela;
      return {
        nome: d.nome,
        atual: atual ? 'page' : 'false',
        inerte: !disponivel,
        abrir: () => { if (disponivel && A) A.irParaTela(d.tela); },
        style: tabBase + (atual
          ? 'background:#2c241a;border-color:#2c241a;color:#f4f1ea;'
          : (disponivel ? 'background:#fffdf8;border-color:#d8cfbd;color:#2c241a;' : 'background:transparent;border-color:#e0d8c6;color:#b0a488;cursor:not-allowed;')),
      };
    });
    return {
      refRoot: this.refRoot,
      mostrarTabs,
      tabs,
      slotStyle: 'position:absolute;top:' + (mostrarTabs ? 98 : 52) + 'px;left:0;right:0;bottom:0;',
      ehSA1: t === 1,
      ehSA2: t === 2,
      ehSA3: t === 3,
      ehSA4: t === 4,
      ehSA5: t === 5,
      ehSA6: t === 6,
      ehSA7: t === 7,
    };
  }
}
</script>

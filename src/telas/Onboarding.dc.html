<!-- Onboarding.dc.html — Hub/Onboarding do cuidador (PC_HOME) · doc fase02-02-04
     ─────────────────────────────────────────────────────────────
     Atrás do PINGATE. Cria o perfil da criança (PERF) e prepara a sessão (SESS),
     aterrissando no modo criança (T2). Seam: usa window.PipocaApp + window.PipocaCanonico
     (onboarding/perfil + repo). Não toca motor/validador.

     Núcleo: PipocaCanonico.onboarding.perfilDoOnboarding / montarEstadoOnboarding.
     Persistência: window.PipocaApp.repo.salvarPerfil (lei do seam).
-->
<x-dc>
<helmet>
  <style>
    .pip-ob-campo { width:100%;padding:13px 15px;border-radius:14px;border:2px solid #e3d4ba;background:#fffdf7;font-family:'Nunito';font-size:16px;color:#3a2c20; }
    .pip-ob-campo:focus { border-color:#c9a86f; }
    .pip-ob-opt { cursor:pointer;transition:transform calc(.12s * var(--pip-mov)) ease; }
    .pip-ob-opt:active { transform:scale(.97); }
  </style>
</helmet>

<div style="position:absolute;inset:0;overflow-y:auto;background:radial-gradient(120% 120% at 50% 0%, var(--pip-areia,#efe6d4) 0%, #ded2be 70%, #d3c5ad 100%);padding:32px 20px;">
  <div style="max-width:560px;margin:0 auto;">

    <!-- Cabeçalho -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
      <div>
        <div style="font-family:var(--pip-fonte-titulo,'Baloo 2');font-weight:700;font-size:11px;letter-spacing:1.8px;text-transform:uppercase;color:#9a8a72;">Para o cuidador</div>
        <div style="font-family:var(--pip-fonte-titulo,'Baloo 2');font-weight:800;font-size:26px;color:#3a2c20;line-height:1.1;margin-top:2px;">Configurar a leitura</div>
      </div>
      <button class="pip-ob-opt" onClick="{{ voltar }}" style="border:none;border-radius:999px;background:rgba(255,255,255,.6);padding:10px 18px;font-family:'Nunito';font-weight:700;font-size:14px;color:#5a6b53;cursor:pointer;">↩ Para a criança</button>
    </div>
    <p style="color:#7a6a54;font-family:'Nunito';font-size:15px;line-height:1.5;margin:0 0 22px;">Crie o perfil de quem vai ler. É rapidinho e calmo — sem pressa.</p>

    <!-- Cartão do formulário — C9: <form> de verdade (Enter submete); os chips
         são type="button" para NÃO submeter; primário com disabled real -->
    <div style="background:var(--pip-creme,#fffaf0);border-radius:22px;box-shadow:0 18px 50px -24px rgba(60,40,20,.35);padding:24px;">
      <form onSubmit="{{ aoSubmeter }}">

      <!-- Nome -->
      <label for="pip-ob-nome" style="display:block;font-family:'Baloo 2';font-weight:700;font-size:14px;color:#3a2c20;">Nome da criança</label>
      <input id="pip-ob-nome" ref="{{ refNome }}" class="pip-ob-campo" style="margin-top:7px;" value="{{ nome }}" onInput="{{ setNome }}" placeholder="Como te chamam em casa?" aria-label="Nome da criança" />

      <!-- Idade -->
      <label for="pip-ob-idade" style="display:block;font-family:'Baloo 2';font-weight:700;font-size:14px;color:#3a2c20;margin-top:18px;">Idade</label>
      <input id="pip-ob-idade" class="pip-ob-campo" style="margin-top:7px;max-width:120px;" value="{{ idade }}" onInput="{{ setIdade }}" type="number" min="3" max="12" aria-label="Idade" aria-describedby="pip-ob-idade-erro" />
      <sc-if value="{{ temErroIdade }}" hint-placeholder-val="{{ false }}">
        <div id="pip-ob-idade-erro" role="status" style="margin-top:6px;color:#9a5a3a;font-family:'Nunito';font-size:13px;">{{ erroIdade }}</div>
      </sc-if>

      <!-- Gênero do personagem (obrigatório · fase13 pós-incidente: o nome é
           sempre o da criança; aqui se escolhe só a concordância) -->
      <label style="display:block;font-family:'Baloo 2';font-weight:700;font-size:14px;color:#3a2c20;margin-top:18px;">Nas histórias, quem vive as aventuras é…</label>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px;">
        <sc-for list="{{ generos }}" as="ge" hint-placeholder-count="2">
          <button type="button" class="pip-ob-opt" onClick="{{ ge.onTap }}" style="{{ ge.style }}">{{ ge.label }}</button>
        </sc-for>
      </div>

      <!-- Nível de leitura -->
      <label style="display:block;font-family:'Baloo 2';font-weight:700;font-size:14px;color:#3a2c20;margin-top:18px;">Nível de leitura</label>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px;">
        <sc-for list="{{ niveis }}" as="nv" hint-placeholder-count="4">
          <button type="button" class="pip-ob-opt" onClick="{{ nv.onTap }}" style="{{ nv.style }}">{{ nv.label }}</button>
        </sc-for>
      </div>

      <!-- Avatar -->
      <label style="display:block;font-family:'Baloo 2';font-weight:700;font-size:14px;color:#3a2c20;margin-top:18px;">Escolha um amiguinho</label>
      <div style="display:flex;gap:12px;margin-top:10px;flex-wrap:wrap;">
        <sc-for list="{{ avatares }}" as="av" hint-placeholder-count="5">
          <button type="button" class="pip-ob-opt" onClick="{{ av.onTap }}" aria-label="{{ av.name }}" aria-pressed="{{ av.pressed }}" style="{{ av.style }}">
            <span style="{{ av.disco }}">{{ av.inicial }}</span>
            <span style="font-family:'Nunito';font-weight:700;font-size:12px;color:#5a4a38;margin-top:6px;">{{ av.name }}</span>
          </button>
        </sc-for>
      </div>

      <!-- Erro acolhedor (geral: nome/gênero pendentes, falha ao salvar) -->
      <sc-if value="{{ temErro }}" hint-placeholder-val="{{ false }}">
        <div role="status" aria-live="polite" style="margin-top:16px;color:#9a5a3a;font-family:'Nunito';font-size:14px;">{{ erro }}</div>
      </sc-if>

      <!-- Tudo pronto -->
      <button type="submit" class="pip-ob-opt" disabled="{{ prontoTravado }}" style="{{ prontoStyle }}">{{ prontoLabel }}</button>
      </form>
    </div>

    <div style="height:24px;"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { nome: '', idade: '7', nivel: 'n2', avatarId: 'pingo', genero: '', salvando: false, erro: '', erroIdade: '' };

  // C9: limites de idade do núcleo (fallback local até o bundle do C12).
  _idadeLimites() {
    const C = window.PipocaCanonico;
    const min = (C && C.perfil && C.perfil.IDADE_MIN) || 3;
    const max = (C && C.perfil && C.perfil.IDADE_MAX) || 12;
    return { min, max };
  }

  _generosDefs() {
    return [
      { id: 'f', label: 'Uma menina' },
      { id: 'm', label: 'Um menino' },
    ];
  }

  _niveisDefs() {
    return [
      { id: 'n1', label: 'Primeiras palavras' },
      { id: 'n2', label: 'Frases curtas' },
      { id: 'n3', label: 'Pequenos textos' },
      { id: 'n4', label: 'Parágrafos' },
    ];
  }
  // C5 (Plan03): tabela ÚNICA (Canon.avatares); fallback de bundle antigo só com IDS.
  _defsAvatares() {
    const C = window.PipocaCanonico;
    if (C && C.avatares && C.avatares.lista) return C.avatares.lista;
    return ['pingo', 'fubá', 'cacau', 'lua', 'tuca'].map((id) => ({
      id, nome: id.charAt(0).toUpperCase() + id.slice(1), cor: '#b8ab90', emoji: '',
    }));
  }

  async _tudoPronto() {
    if (this.state.salvando) return;
    const App = window.PipocaApp;
    const Canon = window.PipocaCanonico;
    const nome = (this.state.nome || '').trim();
    if (!nome) { this.setState({ erro: 'Conte o nome da criança para começar.' }); return; }
    if (!this.state.genero) { this.setState({ erro: 'Conte quem vive as aventuras para continuar.' }); return; }
    if (!App || !Canon || !Canon.onboarding) { this.setState({ erro: 'App indisponível. Recarregue a página.' }); return; }
    // C9 (UI-A10): idade fora de 3–12 é RECUSADA no campo (antes, "40" virava 7 em silêncio).
    const lim = this._idadeLimites();
    const idade = parseInt(this.state.idade, 10);
    if (!Number.isFinite(idade) || idade < lim.min || idade > lim.max) {
      this.setState({ erroIdade: 'Vale de ' + lim.min + ' a ' + lim.max + ' anos.' });
      return;
    }

    this.setState({ salvando: true, erro: '', erroIdade: '' });
    const id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ('p' + Date.now());
    const dados = { id, nome, idade, nivel: this.state.nivel, avatarId: this.state.avatarId, genero: this.state.genero };
    try {
      const perfil = Canon.onboarding.perfilDoOnboarding(dados);
      if (App.repo) await App.repo.salvarPerfil(perfil);
      const est = Canon.onboarding.montarEstadoOnboarding(dados, Date.now());
      // UX por perfil: seleciona zerando os slices (perfil novo começa do zero;
      // nada vaza da criança anterior) e aplica as escolhas do onboarding por
      // cima — o save nasce já com elas (debounce do setState).
      if (App.selecionarPerfil) {
        App.selecionarPerfil(est.perfil);
        App.setState({ modos: est.modos, sessao: est.sessao });
      } else {
        App.setState({ perfil: est.perfil, modos: est.modos, sessao: est.sessao });
      }
      App.aoVoltarParaCrianca(); // modo criança + T2; a criança já vê o avatar
    } catch (e) {
      console.warn('[Onboarding] salvar perfil falhou:', e);
      this.setState({ salvando: false, erro: 'Não consegui salvar agora. Tente de novo.' });
    }
  }

  renderVals() {
    const s = this.state;
    const optBase = 'min-height:46px;border-radius:14px;border:2px solid;font-family:Nunito;font-weight:700;font-size:14px;cursor:pointer;padding:8px 10px;';
    const niveis = this._niveisDefs().map((nv) => {
      const sel = s.nivel === nv.id;
      return {
        label: nv.label,
        onTap: () => this.setState({ nivel: nv.id }),
        style: optBase + (sel
          ? 'background:#3f6f9e;border-color:#3f6f9e;color:#fff;'
          : 'background:#fffdf7;border-color:#e3d4ba;color:#3a2c20;'),
      };
    });
    const generos = this._generosDefs().map((ge) => {
      const sel = s.genero === ge.id;
      return {
        label: ge.label,
        onTap: () => this.setState({ genero: ge.id }), // obrigatório: escolher não desmarca
        style: optBase + (sel
          ? 'background:#7a9a5b;border-color:#7a9a5b;color:#fff;'
          : 'background:#fffdf7;border-color:#e3d4ba;color:#3a2c20;'),
      };
    });
    // C5: o picker mostra o avatar REAL (emoji do Canon.avatares) e marca a seleção.
    const avatares = this._defsAvatares().map((av) => {
      const sel = s.avatarId === av.id;
      return {
        name: av.nome,
        inicial: av.emoji || av.nome.slice(0, 1),
        pressed: sel ? 'true' : 'false',
        onTap: () => this.setState({ avatarId: av.id }),
        style: 'display:flex;flex-direction:column;align-items:center;background:transparent;border:none;cursor:pointer;padding:4px;'
          + (sel ? 'transform:scale(1.04);' : 'opacity:.78;'),
        disco: 'width:56px;height:56px;border-radius:50%;display:grid;place-items:center;'
          + 'font-size:' + (av.emoji ? '28px' : '22px') + ';line-height:1;'
          + (av.emoji ? '' : 'font-family:Baloo 2;font-weight:800;color:#fff;')
          + 'background:' + av.cor + ';'
          + (sel ? 'box-shadow:0 0 0 3px #fff,0 0 0 6px ' + av.cor + ';' : 'box-shadow:0 6px 16px -6px rgba(0,0,0,.3);'),
      };
    });
    const podeSalvar = !!(s.nome || '').trim() && !!s.genero && !s.salvando;
    return {
      nome: s.nome,
      idade: s.idade,
      setNome: (e) => this.setState({ nome: e.target.value, erro: '' }),
      setIdade: (e) => this.setState({ idade: e.target.value, erroIdade: '' }),
      niveis,
      generos,
      avatares,
      erro: s.erro || '',
      temErro: !!s.erro,
      erroIdade: s.erroIdade || '',
      temErroIdade: !!s.erroIdade,
      aoSubmeter: (e) => { if (e && e.preventDefault) e.preventDefault(); this._tudoPronto(); },
      // C9: cursor já no nome ao abrir (foco programático — autofocus não re-dispara em SPA).
      refNome: (el) => { if (el && !this._focou) { this._focou = true; try { el.focus(); } catch (_) {} } },
      // Com perfis já criados (veio do hub), "↩" volta ao painel; no 1º uso, à criança.
      voltar: () => {
        const App = window.PipocaApp; if (!App) return;
        if (App.repo) {
          App.repo.carregarPerfis().then((arr) => {
            if ((arr || []).length && App.estado.modoApp === 'cuidador') App.setState({ tela: 11 });
            else App.aoVoltarParaCrianca();
          }).catch(() => App.aoVoltarParaCrianca());
        } else App.aoVoltarParaCrianca();
      },
      // C9 (UI-A26): apagado é DESABILITADO de verdade.
      prontoTravado: !podeSalvar,
      prontoLabel: s.salvando ? 'Salvando…' : 'Tudo pronto ✓',
      prontoStyle: 'margin-top:22px;width:100%;min-height:52px;border:none;border-radius:16px;'
        + 'font-family:Baloo 2;font-weight:800;font-size:17px;color:#fff;cursor:' + (podeSalvar ? 'pointer' : 'not-allowed') + ';'
        + (podeSalvar
          ? 'background:linear-gradient(150deg,#e8965a,#d5713f);box-shadow:0 10px 24px -8px rgba(181,86,40,.55);'
          : 'background:#cbb692;opacity:.7;'),
    };
  }
}
</script>

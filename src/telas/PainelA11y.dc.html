<!-- PainelA11y.dc.html — Painel "Do meu jeito" (A11Y overlay)
     ─────────────────────────────────────────────────────────────
     Overlay de acessibilidade. Escreve em EstadoApp.a11y.
     Props: visible (boolean), onClose (function)
     Toggles: dyslexia, syllable, contrast, reduceMotion, textScale
-->
<x-dc>

<div style="position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;">
  <div onClick="{{ fecharAjustesA11y }}" style="position:absolute;inset:0;background:rgba(40,28,16,.36);backdrop-filter:blur(2px);"></div>
  <div style="position:relative;width:460px;max-width:92%;max-height:92%;overflow-y:auto;background:#fffdf7;border-radius:26px;padding:26px 28px;box-shadow:0 30px 70px -20px rgba(40,30,18,.55);">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;">
      <div>
        <div style="font-family:'Baloo 2',cursive;font-weight:700;font-size:22px;color:#3a4f63;">Do meu jeito</div>
        <div style="font-size:13px;color:#8a7a64;margin-top:2px;">Ajustes para ler com conforto. Mude quando quiser.</div>
      </div>
      <button onClick="{{ fecharAjustesA11y }}" style="width:38px;height:38px;flex-shrink:0;border-radius:50%;border:none;background:#f1e7d4;cursor:pointer;font-size:16px;color:#7a6a54;">✕</button>
    </div>

    <div style="margin-top:20px;">
      <div style="font-family:'Baloo 2',cursive;font-weight:700;font-size:15px;color:#3a2c20;">Tamanho do texto</div>
      <div style="display:flex;gap:8px;margin-top:10px;">
        <button onClick="{{ setScale1 }}" style="{{ scale1Style }}">A</button>
        <button onClick="{{ setScale2 }}" style="font-size:19px;{{ scale2Style }}">A+</button>
        <button onClick="{{ setScale3 }}" style="font-size:23px;{{ scale3Style }}">A++</button>
      </div>
    </div>

    <div style="height:1px;background:rgba(160,140,110,.18);margin:18px 0 4px;"></div>

    <div style="display:flex;align-items:center;justify-content:space-between;padding:13px 2px;">
      <div style="padding-right:14px;">
        <div style="font-family:'Baloo 2',cursive;font-weight:700;font-size:15px;color:#3a2c20;">Fonte para dislexia</div>
        <div style="font-size:12.5px;color:#9a8a72;margin-top:1px;line-height:1.35;">Letras mais abertas e fáceis de distinguir.</div>
      </div>
      <button onClick="{{ toggleDys }}" style="{{ swDys }}"><div style="{{ knobDys }}"></div></button>
    </div>

    <div style="display:flex;align-items:center;justify-content:space-between;padding:13px 2px;">
      <div style="padding-right:14px;">
        <div style="font-family:'Baloo 2',cursive;font-weight:700;font-size:15px;color:#3a2c20;">Destaque silábico</div>
        <div style="font-size:12.5px;color:#9a8a72;margin-top:1px;line-height:1.35;">Separa as sílabas: va·ga·lu·me.</div>
      </div>
      <button onClick="{{ toggleSyl }}" style="{{ swSyl }}"><div style="{{ knobSyl }}"></div></button>
    </div>

    <div style="display:flex;align-items:center;justify-content:space-between;padding:13px 2px;">
      <div style="padding-right:14px;">
        <div style="font-family:'Baloo 2',cursive;font-weight:700;font-size:15px;color:#3a2c20;">Alto contraste</div>
        <div style="font-size:12.5px;color:#9a8a72;margin-top:1px;line-height:1.35;">Texto mais escuro sobre o fundo.</div>
      </div>
      <button onClick="{{ toggleCon }}" style="{{ swCon }}"><div style="{{ knobCon }}"></div></button>
    </div>

    <div style="display:flex;align-items:center;justify-content:space-between;padding:13px 2px;">
      <div style="padding-right:14px;">
        <div style="font-family:'Baloo 2',cursive;font-weight:700;font-size:15px;color:#3a2c20;">Reduzir movimento</div>
        <div style="font-size:12.5px;color:#9a8a72;margin-top:1px;line-height:1.35;">Cenas mais paradas, sem balanço.</div>
      </div>
      <button onClick="{{ toggleMotion }}" style="{{ swMotion }}"><div style="{{ knobMotion }}"></div></button>
    </div>

    <button onClick="{{ fecharAjustesA11y }}" style="margin-top:18px;width:100%;border:none;background:linear-gradient(150deg,#e8965a,#d5713f);color:#fff;border-radius:16px;padding:15px;font-family:'Baloo 2',cursive;font-weight:700;font-size:17px;cursor:pointer;box-shadow:0 8px 20px -6px rgba(181,86,40,.5);">Pronto</button>

    <!-- Rodapé do cuidador: leva ao PINGATE (o PIN com lockout é a proteção;
         ao voltar, a leitura retoma de onde estava — telaCriancaAnterior). -->
    <div style="height:1px;background:rgba(160,140,110,.18);margin:16px 0 0;"></div>
    <button onClick="{{ souOAdulto }}" style="margin-top:12px;width:100%;min-height:46px;border:1.5px dashed rgba(160,140,110,.4);background:transparent;border-radius:14px;padding:11px;font-family:'Nunito';font-weight:700;font-size:14px;color:#7a6a54;cursor:pointer;">🔒 Sou o adulto (ajustes do cuidador)</button>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script
  data-props="{
    &quot;onClose&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;function&quot;, &quot;section&quot;: &quot;PainelA11y&quot;, &quot;label&quot;: &quot;Callback ao fechar&quot; }
  }">
class Component extends DCLogic {
  state = {};

  _swStyle(on) {
    return 'width:50px;height:28px;border-radius:999px;border:none;cursor:pointer;position:relative;flex-shrink:0;background:' + (on ? '#6f9b4f' : '#d6c6ab') + ';';
  }
  _knobStyle(on) {
    return 'position:absolute;top:3px;left:' + (on ? '25px' : '3px') + ';width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .15s;';
  }
  _scaleBtn(on) {
    return 'flex:1;border:none;cursor:pointer;border-radius:11px;padding:9px 0;font-family:"Baloo 2",cursive;font-weight:700;background:' + (on ? '#3f6f9e' : '#f1e7d4') + ';color:' + (on ? '#fff' : '#8a7a64') + ';';
  }

  _getA11y() {
    const App = window.PipocaApp;
    return App ? App.estado.a11y : { textScale: 1, dyslexia: false, syllable: false, contrast: false, reduceMotion: false };
  }

  _patchA11y(patch) {
    const App = window.PipocaApp;
    if (App) {
      App.setState({ a11y: { ...App.estado.a11y, ...patch } });
    }
    this.setState({});
  }

  fecharAjustesA11y() {
    const App = window.PipocaApp;
    if (App) App.setState({ showA11y: false });
    if (this.props && typeof this.props.onClose === 'function') this.props.onClose();
  }

  // Fecha o modal e abre o PINGATE (T1). Cancelar o PIN volta pela mesma
  // porta (aoVoltarParaCrianca) — que agora retoma a tela onde a criança estava.
  souOAdulto() {
    this.fecharAjustesA11y();
    const App = window.PipocaApp;
    if (App && App.abrirPortao) App.abrirPortao();
  }

  renderVals() {
    const A = this._getA11y();
    const t = (key) => () => this._patchA11y({ [key]: !A[key] });
    const setScale = (v) => () => this._patchA11y({ textScale: v });

    return {
      fecharAjustesA11y: () => this.fecharAjustesA11y(),
      souOAdulto: () => this.souOAdulto(),
      swMotion: this._swStyle(A.reduceMotion), knobMotion: this._knobStyle(A.reduceMotion), toggleMotion: t('reduceMotion'),
      swDys:    this._swStyle(A.dyslexia),     knobDys:    this._knobStyle(A.dyslexia),     toggleDys:    t('dyslexia'),
      swSyl:    this._swStyle(A.syllable),     knobSyl:    this._knobStyle(A.syllable),     toggleSyl:    t('syllable'),
      swCon:    this._swStyle(A.contrast),     knobCon:    this._knobStyle(A.contrast),     toggleCon:    t('contrast'),
      scale1Style: this._scaleBtn(A.textScale === 1),
      scale2Style: this._scaleBtn(A.textScale === 1.2),
      scale3Style: this._scaleBtn(A.textScale === 1.45),
      setScale1: setScale(1), setScale2: setScale(1.2), setScale3: setScale(1.45),
    };
  }
}
</script>

<!-- Tela3SelecaoCenario.dc.html — Galeria de cenários (T3)
     ────────────────────────────────────────────────────────
     Exibe o cenário em destaque (Quintal) + grade dos demais, alimentada pelo
     MANIFESTO docs/cenarios.index.json (E4) — id canônico único em galeria,
     liberação e motor. Escolher → App.carregarCenario(id) → composição → T4.
     Sem conteúdo (disponivel:false) ou sem liberação → "Em breve", pick inerte.
     Header: avatar + nome + vagalumes + ⚙.
-->
<x-dc>
<helmet>
  <style>
    /* C2 (UI-C55): no celular a galeria empilha (destaque em cima, grade 2×2 embaixo)
       em vez de espremer 5 cartões numa linha. */
    @media (max-width: 700px) {
      .pip-t3-galeria { flex-direction: column; height: auto !important; }
      .pip-t3-galeria > button { min-height: 260px; }
      .pip-t3-grade { min-height: 320px; }
    }
  </style>
</helmet>

<div style="position:absolute;inset:0;display:flex;flex-direction:column;background:linear-gradient(180deg,#fdf3df,#f6ead2);">

  <!-- Header — a barra única das telas da criança (B6). Avatar+saudação = trocar de leitor
       (B5), saldo = pote (B5), 🎁 guardado, ⚙ Do meu jeito. -->
  <dc-import name="BarraCrianca" mostrarAvatar="{{ true }}" avatarRef="{{ childAvatarRef }}" saudacao="{{ saudacao }}" subtitulo="{{ subtitulo }}" trocarLeitor="{{ trocarLeitor }}" mostrarSaldo="{{ true }}" vagalumes="{{ vagalumes }}" verPote="{{ verPote }}" poupado="{{ poupado }}" abrirAjustes="{{ abrirAjustesA11y }}"></dc-import>

  <!-- Content — C2 (ML-1): a T3 ROLA verticalmente; a galeria fica acima e a ESTANTE
       de histórias vira seção digna abaixo (não mais um rodapé de 130px). -->
  <div style="flex:1;min-height:0;overflow-y:auto;padding:26px 36px 34px;display:flex;flex-direction:column;">
    <div>
      <div style="font-family:'Baloo 2',cursive;font-weight:700;font-size:30px;color:#3a4f63;">Onde a história acontece hoje?</div>
      <p style="font-size:var(--pip-fs-3);line-height:var(--pip-lh-texto);color:var(--pip-texto-suave);margin-top:4px;max-width:620px;">Escolha um lugar. Quanto mais você lê, mais o lugar ganha vida.</p>
    </div>
    <div class="pip-t3-galeria" style="flex-shrink:0;height:clamp(320px,52vh,440px);display:flex;gap:20px;margin-top:20px;">

      <!-- Featured (Quintal) -->
      <button onClick="{{ featuredPick }}" style="flex:1.35;min-width:0;position:relative;border:none;cursor:pointer;border-radius:26px;overflow:hidden;padding:0;background:#e3d6bf;box-shadow:0 16px 32px -14px rgba(74,59,44,.45);text-align:left;">
        <div ref="{{ featuredSceneRef }}" style="position:absolute;inset:0;"></div>
        <div style="position:absolute;left:0;right:0;bottom:0;height:150px;background:linear-gradient(0deg,rgba(40,26,12,.8),rgba(40,26,12,.2) 55%,transparent);"></div>
        <div style="position:absolute;left:26px;bottom:24px;right:26px;color:#fff;">
          <div style="font-size:12px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;opacity:.82;">Favorito de hoje</div>
          <div style="font-family:'Baloo 2',cursive;font-weight:700;font-size:32px;line-height:1.05;margin-top:5px;">O Quintal</div>
          <div style="display:flex;align-items:center;gap:10px;margin-top:11px;">
            <span style="font-size:15px;opacity:.92;">Com um vaga-lume no quintal</span>
            <span style="background:var(--pip-cta-ini);border-radius:999px;padding:6px 15px;font-family:'Baloo 2',cursive;font-weight:700;font-size:13.5px;box-shadow:0 4px 12px -3px rgba(181,86,40,.6);">Brincar aqui →</span>
          </div>
        </div>
      </button>

      <!-- Grid (outros) -->
      <div class="pip-t3-grade" style="flex:1;min-width:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:16px;">
        <sc-for list="{{ gridCenas }}" as="cn" hint-placeholder-count="4">
          <button onClick="{{ cn.pick }}" style="position:relative;border:none;cursor:{{ cn.cursor }};border-radius:20px;overflow:hidden;padding:0;background:#e3d6bf;box-shadow:0 10px 22px -12px rgba(74,59,44,.4);text-align:left;opacity:{{ cn.opacidade }};">
            <div ref="{{ cn.sceneRef }}" style="position:absolute;inset:0;"></div>
            <div style="position:absolute;left:0;right:0;bottom:0;height:80px;background:linear-gradient(0deg,rgba(40,26,12,.76),transparent);"></div>
            <div style="position:absolute;top:11px;right:11px;background:var(--pip-texto-suave);color:#fff;border-radius:999px;padding:3px 11px;font-family:'Baloo 2',cursive;font-weight:700;font-size:11px;">{{ cn.badge }}</div>
            <div style="position:absolute;left:15px;bottom:12px;right:15px;color:#fff;">
              <div style="font-family:'Baloo 2',cursive;font-weight:700;font-size:17.5px;line-height:1.05;">{{ cn.name }}</div>
              <div style="font-size:12px;opacity:.85;margin-top:2px;">{{ cn.desc }}</div>
            </div>
          </button>
        </sc-for>
      </div>
    </div>

    <!-- Minhas histórias — C2 (ML-1): estante digna, agrupada por dia, sem duplicatas
         (só completas — C1), cartões ≥120px com título inteiro; grade responsiva
         (1 coluna no celular, sem carrossel cortado). Coração é botão IRMÃO ≥48px. -->
    <div style="flex-shrink:0;margin-top:22px;">
      <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;">
        <div style="font-family:'Baloo 2',cursive;font-weight:700;font-size:22px;color:#3a4f63;">Minhas histórias</div>
        <div style="font-size:13px;color:var(--pip-texto-suave);">{{ contagemHistorias }} · toque para reler · 💛 guarda para sempre</div>
      </div>
      <sc-if value="{{ temHistorias }}" hint-placeholder-val="{{ false }}">
        <sc-for list="{{ gruposHistorias }}" as="gd" hint-placeholder-count="1">
          <div style="margin-top:12px;">
            <div style="font-family:'Baloo 2',cursive;font-weight:700;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--pip-texto-suave);">{{ gd.rotulo }}</div>
            <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:8px;">
              <sc-for list="{{ gd.cartoes }}" as="hh" hint-placeholder-count="2">
                <div style="display:flex;align-items:stretch;min-height:120px;background:var(--pip-superficie);border-radius:18px;box-shadow:0 8px 20px -12px rgba(74,59,44,.35);overflow:hidden;">
                  <button onClick="{{ hh.abrir }}" style="flex:1;min-width:0;display:flex;align-items:center;gap:12px;border:none;background:transparent;cursor:pointer;text-align:left;padding:14px 6px 14px 14px;">
                    <div aria-hidden="true" style="font-size:34px;flex-shrink:0;">{{ hh.emoji }}</div>
                    <div style="min-width:0;">
                      <div style="font-family:'Baloo 2',cursive;font-weight:700;font-size:15px;color:#3a2c20;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">{{ hh.titulo }}</div>
                      <div style="font-size:12px;color:var(--pip-texto-suave);margin-top:4px;">{{ hh.quando }}</div>
                    </div>
                  </button>
                  <button onClick="{{ hh.coracao }}" aria-label="Guardar para sempre" aria-pressed="{{ hh.favorita }}" title="Guardar para sempre" style="border:none;background:transparent;font-size:22px;cursor:pointer;flex-shrink:0;width:52px;min-height:48px;display:flex;align-items:center;justify-content:center;">{{ hh.coracaoIcone }}</button>
                </div>
              </sc-for>
            </div>
          </div>
        </sc-for>
      </sc-if>
      <sc-if value="{{ semHistorias }}" hint-placeholder-val="{{ false }}">
        <div style="margin-top:10px;background:rgba(255,255,255,.6);border:1.5px dashed var(--pip-areia-borda);border-radius:16px;padding:18px;font-size:var(--pip-fs-3);color:var(--pip-texto-suave);">Suas histórias terminadas vão morar aqui ✨ Leia uma até o fim e volte para reler quando quiser.</div>
      </sc-if>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { historias: [] };

  _inject(el, html) { if (el && el._k !== html) { el.innerHTML = html; el._k = html; } }

  // Minhas histórias: lê do seam (com guarda de perfilId capturado no
  // agendamento) e normaliza na exibição (defesa se a poda async não rodou).
  async _carregarHistorias() {
    const App = window.PipocaApp;
    const Canon = window.PipocaCanonico;
    const pid = App && App.estado.perfil ? App.estado.perfil.id : null;
    if (!pid || !App.repo || !App.repo.carregarHistorias) return;
    try {
      const lista = await App.repo.carregarHistorias(pid);
      if (!App.estado.perfil || App.estado.perfil.id !== pid) return; // trocou no meio
      const vivas = (Canon && Canon.historias)
        ? Canon.historias.normalizarHistorias(lista || [], Date.now())
        : (lista || []);
      // C2/C1: a estante exibe SÓ completas (fallback inline enquanto o bundle não
      // expõe apenasCompletas — o rebuild é no C12).
      const H = Canon && Canon.historias;
      const completas = (H && H.apenasCompletas)
        ? H.apenasCompletas(vivas)
        : vivas.filter((h) => h.intermediaria !== true);
      const chave = JSON.stringify(completas.map((h) => h.id + ':' + h.favorita));
      if (chave !== this._chaveHist) { this._chaveHist = chave; this.setState({ historias: completas }); }
    } catch (_) {}
  }

  async _favoritar(h) {
    const App = window.PipocaApp;
    if (!App || !App.favoritarHistoria) return;
    await App.favoritarHistoria(h.id, !h.favorita);
    this._carregarHistorias();
  }

  _scene(key) {
    // C5: a fonte de verdade dos SVGs é Canon.cenas (core); o bloco abaixo é o
    // fallback para bundle antigo (mesma arte) e sai quando E5 derivar do manifesto.
    const C5c = window.PipocaCanonico;
    if (C5c && C5c.cenas && C5c.cenas.svgCena) return C5c.cenas.svgCena(key);
    const S = {
      quintal: "<svg viewBox='0 0 400 300' width='100%' height='100%' preserveAspectRatio='xMidYMid slice' xmlns='http://www.w3.org/2000/svg'><defs><linearGradient id='qsky' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#fce7bd'/><stop offset='.55' stop-color='#f8d291'/><stop offset='1' stop-color='#f4ba74'/></linearGradient><radialGradient id='qsun' cx='.5' cy='.5' r='.5'><stop offset='0' stop-color='#fff8e2'/><stop offset='.55' stop-color='#ffe49e'/><stop offset='1' stop-color='#ffe49e' stop-opacity='0'/></radialGradient><filter id='qsoft' x='-30%' y='-30%' width='160%' height='160%'><feGaussianBlur stdDeviation='2.2'/></filter></defs><rect width='400' height='300' fill='url(#qsky)'/><circle cx='305' cy='86' r='74' fill='url(#qsun)'/><circle cx='305' cy='86' r='30' fill='#fff3d0'/><path d='M0 208 Q120 168 240 203 T400 198 V300 H0 Z' fill='#c2d693' opacity='.92'/><path d='M0 234 Q140 206 280 231 T400 229 V300 H0 Z' fill='#a6c372'/><rect y='250' width='400' height='50' fill='#90b65d'/><rect x='86' y='150' width='16' height='92' rx='6' fill='#9d6d43'/><g filter='url(#qsoft)'><circle cx='94' cy='139' r='43' fill='#7da94f'/><circle cx='64' cy='155' r='28' fill='#8db75b'/><circle cx='122' cy='156' r='30' fill='#6f9a49'/><circle cx='98' cy='116' r='26' fill='#93bd60'/></g><g fill='#c89c6c'><rect x='250' y='205' width='12' height='48' rx='3'/><rect x='285' y='205' width='12' height='48' rx='3'/><rect x='320' y='205' width='12' height='48' rx='3'/><rect x='355' y='205' width='12' height='48' rx='3'/></g><rect x='245' y='214' width='128' height='8' rx='4' fill='#ba8c5b'/><rect x='245' y='234' width='128' height='8' rx='4' fill='#ba8c5b'/><circle cx='172' cy='270' r='15' fill='#e27c50'/></svg>",
      quarto:   "<svg viewBox='0 0 400 300' width='100%' height='100%' preserveAspectRatio='xMidYMid slice' xmlns='http://www.w3.org/2000/svg'><rect width='400' height='300' fill='#e8d2e6'/><rect x='232' y='40' width='130' height='110' rx='12' fill='#3a3357'/><rect x='244' y='52' width='106' height='86' rx='7' fill='#2a2747'/><g fill='#fff' opacity='.7'><circle cx='270' cy='80' r='1.7'/><circle cx='300' cy='110' r='1.5'/><circle cx='258' cy='118' r='1.3'/></g><rect y='196' width='400' height='104' fill='#d9b69a'/><rect x='34' y='150' width='150' height='62' rx='14' fill='#caa6c4'/><circle cx='104' cy='150' r='18' fill='#fff6e6'/></svg>",
      floresta: "<svg viewBox='0 0 400 300' width='100%' height='100%' preserveAspectRatio='xMidYMid slice' xmlns='http://www.w3.org/2000/svg'><rect width='400' height='300' fill='#dce8b8'/><g fill='#487038'><path d='M-10 300 V190 q60 -90 130 0 V300 Z'/><path d='M250 300 V200 q70 -100 160 0 V300 Z'/></g><rect x='120' y='150' width='20' height='150' rx='6' fill='#6e4a30'/><g fill='#3f6b33'><circle cx='130' cy='130' r='52'/><circle cx='86' cy='160' r='34'/><circle cx='176' cy='162' r='36'/></g></svg>",
      espaco:   "<svg viewBox='0 0 400 300' width='100%' height='100%' preserveAspectRatio='xMidYMid slice' xmlns='http://www.w3.org/2000/svg'><rect width='400' height='300' fill='#2b2a55'/><g fill='#fff'><circle cx='40' cy='40' r='1.6'/><circle cx='150' cy='30' r='1.3'/><circle cx='340' cy='40' r='1.8'/><circle cx='60' cy='150' r='1.2'/></g><circle cx='150' cy='175' r='66' fill='#f0a972'/><ellipse cx='150' cy='175' rx='104' ry='26' fill='none' stroke='#e8c98a' stroke-width='7' opacity='.7' transform='rotate(-18 150 175)'/></svg>",
      fundomar: "<svg viewBox='0 0 400 300' width='100%' height='100%' preserveAspectRatio='xMidYMid slice' xmlns='http://www.w3.org/2000/svg'><rect width='400' height='300' fill='#3f93a8'/><g fill='#2f7286'><path d='M0 300 V250 q40 -50 80 -10 q50 -60 100 -6 q40 -40 90 -2 q60 -36 130 4 V300 Z'/></g><g transform='translate(250 110)'><ellipse cx='0' cy='0' rx='26' ry='17' fill='#f0a85a'/><polygon points='22,0 44,-14 44,14' fill='#e8923f'/><circle cx='-10' cy='-3' r='3' fill='#2b2118'/></g></svg>",
    };
    return S[key] || S.quintal;
  }

  // C5 (Plan03): avatar por emoji sobre disco (tabela única Canon.avatares);
  // fallback de bundle antigo com disco neutro + inicial.
  _defAvatar(id) {
    const C = window.PipocaCanonico;
    if (C && C.avatares && C.avatares.porId) return C.avatares.porId(id);
    const nome = (id || '?').charAt(0).toUpperCase() + String(id || '').slice(1);
    return { id, nome, cor: '#b8ab90', emoji: '' };
  }
  _avatarHTML(d, px) {
    const conteudo = d.emoji || (d.nome || '?').slice(0, 1).toUpperCase();
    const fe = Math.round(px * (d.emoji ? 0.54 : 0.4));
    return '<div role="img" aria-label="' + d.nome + '" style="width:' + px + 'px;height:' + px + 'px;border-radius:50%;background:' + d.cor + ';display:grid;place-items:center;">'
      + '<span aria-hidden="true" style="font-size:' + fe + 'px;line-height:1;' + (d.emoji ? '' : "font-family:'Baloo 2',cursive;font-weight:800;color:#fff;") + '">' + conteudo + '</span></div>';
  }

  escolherCenario(cenarioId) {
    const App = window.PipocaApp;
    if (!cenarioId || !App) return;
    // E4: garante o cenário CARREGADO (grafo + fichas, com cache) antes de
    // compor — o id canônico é o mesmo da galeria/liberação/motor.
    const prosseguir = () => {
      App.iniciarComposicao();
      App.setState({
        historia: { cenarioId, objetos: [], aberta: true },
        rascunhoT4: null, // B7: história nova = rascunho da T4 zerado
        tela: 4,
      });
      const R = window.PipocaRoteador;
      if (R) R.irParaTela(4);
    };
    if (App.carregarCenario) {
      App.carregarCenario(cenarioId).then((ok) => { if (ok) prosseguir(); }).catch(() => {});
    } else prosseguir(); // guarda p/ estado.js antigo
  }

  abrirAjustesA11y() {
    const App = window.PipocaApp;
    if (App) App.setState({ showA11y: true });
  }

  // B5 (ML-3): saídas da criança sem portão — T2 é o "login visual" livre por design
  // e a T7 é dela. setState({tela}) respeita a guarda KIDMODE (só superfícies adultas
  // são barradas).
  trocarLeitor() {
    const App = window.PipocaApp;
    if (App) App.setState({ tela: 2 });
  }
  verPote() {
    const App = window.PipocaApp;
    if (App) App.setState({ tela: 7 });
  }

  componentDidMount() {
    this._updateRefs();
    this._carregarHistorias();
    // Recarrega quando o estado global muda com a T3 ativa (favoritar no
    // leitor, troca de perfil, história nova) — leitura local barata.
    const App = window.PipocaApp;
    if (App && App.subscribe) {
      this._unsubHist = App.subscribe(() => {
        if (App.estado.tela === 3) this._carregarHistorias();
      });
    }
  }
  componentWillUnmount() { if (this._unsubHist) this._unsubHist(); }
  componentDidUpdate() { this._updateRefs(); }

  _updateRefs() {
    const App = window.PipocaApp;
    const perfil = App ? App.estado.perfil : null;
    if (perfil && this._childAvatarEl) {
      this._inject(this._childAvatarEl, this._avatarHTML(this._defAvatar(perfil.avatarId), 42));
    }
    const keys = this._gridSvgKeys || ['quarto','floresta','espaco','fundomar'];
    keys.forEach(k => {
      const el = this['_scene_' + k];
      if (el) this._inject(el, this._scene(k));
    });
  }

  renderVals() {
    const App = window.PipocaApp;
    const estado = App ? App.estado : {};
    const perfil = estado.perfil || null;
    const vagalumes = estado.economia ? estado.economia.vagalumes : 0;
    const poupado = estado.economia ? (estado.economia.poupado || 0) : 0;
    const childName = perfil ? perfil.nome : 'criança';
    // B6 (UI-C41): saudação da faixa etária (decisão do dono) + concordância com o
    // gênero do perfil (ausente ⇒ feminina, GENERO_CONCORDANCIA_PADRAO); "Leitor em
    // ascensão" saiu. O subtítulo diz o que o toque faz (trocar de leitor).
    const saudacao = 'Oi, ' + childName + '! Vamos ler?';
    const Cg = window.PipocaCanonico;
    const generoPadrao = (Cg && Cg.geracao && Cg.geracao.GENERO_CONCORDANCIA_PADRAO) || 'f';
    const genero = (perfil && (perfil.genero === 'm' || perfil.genero === 'f')) ? perfil.genero : generoPadrao;
    const subtitulo = (genero === 'm' ? 'Pronto' : 'Pronta') + ' para mais uma? · trocar de leitor';

    const childAvatarRef = (el) => { this._childAvatarEl = el; this._updateRefs(); };

    const featuredSceneRef = (el) => this._inject(el, this._scene('quintal'));

    // UX por perfil: a grade obedece os cenários liberados pelo cuidador
    // (save da criança; null → CENARIOS_PADRAO = só o quintal). O quintal em
    // destaque é SEMPRE jogável — a lista governa só os demais.
    const Canon = window.PipocaCanonico;
    const liberados = (Canon && Canon.cardapio)
      ? Canon.cardapio.normalizarCenariosLiberados(estado.cenariosLiberados)
      : ['quintal_anoitecer'];
    // E4 (ML-2): a grade nasce do MANIFESTO (docs/cenarios.index.json) — o id
    // CANÔNICO é o vocabulário único de galeria, liberação e motor (o mapa
    // provisório do C7 saiu). Jogável = tem conteúdo no manifesto (disponivel)
    // E o cuidador liberou; senão "Em breve" honesto. Sem manifesto ainda
    // (boot/estado antigo), a lista conhecida de sempre.
    const manifesto = (App && App.cenariosDisponiveis && App.cenariosDisponiveis()) || null;
    const gridDados = manifesto
      ? manifesto.filter((c) => c && c.id !== 'quintal_anoitecer')
      : [
          { id:'quarto',   svg:'quarto',   nome:'O Quarto',     descricao:'Histórias antes de dormir', disponivel:false },
          { id:'floresta', svg:'floresta', nome:'A Floresta',   descricao:'Aventura entre árvores', disponivel:false },
          { id:'espaco',   svg:'espaco',   nome:'O Espaço',     descricao:'Entre estrelas e planetas', disponivel:false },
          { id:'fundomar', svg:'fundomar', nome:'Fundo do Mar', descricao:'Com peixes e corais', disponivel:false },
        ];
    this._gridSvgKeys = gridDados.map((d) => d.svg);
    const gridCenas = gridDados.map(d => {
      const jogavel = d.disponivel === true && liberados.indexOf(d.id) >= 0;
      return {
        name: d.nome,
        desc: d.descricao,
        badge: jogavel ? 'Novo!' : 'Em breve',
        cursor: jogavel ? 'pointer' : 'not-allowed',
        opacidade: jogavel ? '1' : '.72',
        sceneRef: (el) => { this['_scene_' + d.svg] = el; this._inject(el, this._scene(d.svg)); },
        pick: jogavel ? (() => this.escolherCenario(d.id)) : (() => {}),
      };
    });

    // Minhas histórias (C2): agrupadas por dia (fallback inline até o bundle do C12),
    // cartão = botão de abrir + coração IRMÃO (nunca botão aninhado).
    const CanonH = window.PipocaCanonico && window.PipocaCanonico.historias;
    const agora = Date.now();
    const vivas = this.state.historias || [];
    const grupos = (CanonH && CanonH.agruparPorDia)
      ? CanonH.agruparPorDia(vivas, agora)
      : (() => {
          const gs = []; const idx = {};
          for (const h of vivas) {
            const rotulo = CanonH ? CanonH.dataRelativa(h.criadaEm, agora) : 'hoje';
            if (!(rotulo in idx)) { idx[rotulo] = gs.length; gs.push({ rotulo, historias: [] }); }
            gs[idx[rotulo]].historias.push(h);
          }
          return gs;
        })();
    const gruposHistorias = grupos.map((g) => ({
      rotulo: g.rotulo,
      cartoes: g.historias.map((h) => ({
        emoji: h.emoji || '✨',
        titulo: h.titulo,
        quando: CanonH ? CanonH.dataRelativa(h.criadaEm, agora) : '',
        favorita: h.favorita ? 'true' : 'false',
        coracaoIcone: h.favorita ? '💛' : '🤍',
        abrir: () => { if (App) App.setState({ leitorHistoria: h }); },
        coracao: () => this._favoritar(h),
      })),
    }));
    const total = vivas.length;

    return {
      childName,
      saudacao,
      subtitulo,
      vagalumes,
      poupado,
      temPoupado: poupado > 0,
      temHistorias: total > 0,
      semHistorias: total === 0,
      gruposHistorias,
      contagemHistorias: total === 1 ? '1 história' : total + ' histórias',
      childAvatarRef,
      featuredSceneRef,
      featuredPick: () => this.escolherCenario('quintal_anoitecer'),
      gridCenas,
      abrirAjustesA11y: () => this.abrirAjustesA11y(),
      trocarLeitor: () => this.trocarLeitor(),
      verPote: () => this.verPote(),
    };
  }
}
</script>
